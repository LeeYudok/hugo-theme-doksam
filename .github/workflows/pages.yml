name: pages

# 예제 사이트를 GitHub Pages 에 띄운다(테마 데모).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build example site
        run: hugo --source exampleSite --themesDir ../.. --theme "${GITHUB_REPOSITORY#*/}" --baseURL "${{ steps.pages.outputs.base_url }}/" --minify
      - name: Build search index
        run: npx -y pagefind@1.4.0 --site exampleSite/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
